name: Deploy to saturn

on:
  push:
    branches: [main]

# Only one deploy at a time; skip if a newer push lands mid-deploy.
concurrency:
  group: deploy-portfolio
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          # The deploy key is forced (via authorized_keys command=) to run only
          # /opt/portfolio/deploy.sh. No remote command is sent, so the restriction
          # holds: the agent connects and the server-side script runs on its own.
          script: |
            echo "deploy triggered by ${{ github.actor }} at ${{ github.sha }}"
